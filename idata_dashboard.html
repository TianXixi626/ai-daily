const MOBILE_ALIAS = {"王者荣耀": "王者荣耀", "和平精英": "和平精英", "三角洲行动": "三角洲行动", "洛克王国：世界": "洛克王国手游", "金铲铲之战": "金铲铲之战", "火影忍者": "火影忍者手游", "无畏契约：源能行动": "无畏契约手游", "暗区突围": "暗区突围", "英雄联盟手游": "英雄联盟手游", "穿越火线:枪战王者": "穿越火线手游", "逆战：未来": "逆战：未来", "斗地主": "斗地主", "地下城与勇士：起源": "DNF：起源", "使命召唤手游正式服": "使命召唤手游", "qq飞车手游": "QQ飞车手游", "元梦之星": "元梦之星", "部落冲突": "部落冲突", "FIFA足球世界": "FIFA足球世界", "QQ炫舞手游": "QQ炫舞手游", "光与夜之恋": "光与夜之恋", "王者荣耀世界": "王者荣耀世界"};
const PC_ORDER = ["英雄联盟", "无畏契约", "穿越火线", "QQ飞车", "地下城与勇士", "逆战", "QQ炫舞", "暗区突围：无限", "NBA2K Online2", "QQ三国", "穿越火线高清大区", "FC Online", "NBA2K", "卡拉彼丘端游", "炫舞时代", "QQ华夏", "命运方舟", "天涯明月刀", "剑灵", "自由幻想"];
const PC_ALIAS = {"英雄联盟": "英雄联盟", "无畏契约": "无畏契约", "穿越火线": "穿越火线", "QQ飞车": "QQ飞车", "地下城与勇士": "DNF", "逆战": "逆战", "QQ炫舞": "QQ炫舞", "暗区突围：无限": "暗区突围:无限", "NBA2K Online2": "NBA2KOL2", "QQ三国": "QQ三国", "穿越火线高清大区": "CFHD", "FC Online": "FC Online", "NBA2K": "NBA2K", "卡拉彼丘端游": "卡拉彼丘", "炫舞时代": "炫舞时代", "QQ华夏": "QQ华夏", "命运方舟": "命运方舟", "天涯明月刀": "天涯明月刀", "剑灵": "剑灵", "自由幻想": "自由幻想"};

let curType = 'mobile';
let curDateIdx = DATA.dates.length - 1;

// Index data by date+game
const mobileIdx = {};
DATA.mobile.forEach(r => { const k = r.date + '|' + r.game; mobileIdx[k] = r; });
const pcIdx = {};
DATA.pc.forEach(r => { const k = r.date + '|' + r.game; pcIdx[k] = r; });

function getDateStr(offset) {
    const idx = curDateIdx + offset;
    return (idx >= 0 && idx < DATA.dates.length) ? DATA.dates[idx] : null;
}

function pctChg(cur, prev) {
    if (!prev || prev === 0) return 0;
    return (cur - prev) / prev * 100;
}

function fmtChg(v, fmt) {
    if (fmt === 'pp') return (v >= 0 ? '+' : '') + v.toFixed(1);
    return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
}

function cellHTML(valStr, dod, wow, dodFmt, wowFmt) {
    if (!valStr) return '<td class="c"><span class="val na">-</span></td>';
    const dc = dod > 0 ? 'up' : (dod < 0 ? 'dn' : 'fl');
    const wc = wow > 0 ? 'up' : (wow < 0 ? 'dn' : 'fl');
    return `<td class="c"><span class="val">${valStr}</span>`
        + `<span class="chg"><span class="${dc}">${fmtChg(dod, dodFmt||'pct')}</span>`
        + `<span class="${wc}">${fmtChg(wow, wowFmt||'pct')}</span></span></td>`;
}

function getEvent(game, date, type) {
    const evts = DATA.events[type];
    if (!evts || !evts[date]) return '';
    const dateEvts = evts[date];
    return dateEvts[game] || '';
}

function render() {
    const date = DATA.dates[curDateIdx];
    const prevDate = getDateStr(-1);
    const weekDate = getDateStr(-7) || getDateStr(-6) || getDateStr(-5);

    // Update controls
    document.getElementById('dateDisplay').textContent = date;
    const dow = new Date(date + 'T00:00:00').getDay();
    document.getElementById('dateWeekday').textContent = WEEKDAYS[dow];
    document.getElementById('dateSelect').value = date;

    // Toggle buttons
    document.querySelectorAll('#typeToggle button').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && curType === 'mobile') || (i === 1 && curType === 'pc'));
    });

    if (curType === 'mobile') renderMobile(date, prevDate, weekDate);
    else renderPC(date, prevDate, weekDate);
}

function renderMobile(date, prevDate, weekDate) {
    const idx = mobileIdx;
    let h = '<table><thead><tr>';
    h += '<th class="sticky">游戏</th>';
    h += '<th>DAU<br><span class="unit">万</span></th>';
    h += '<th>新增<br><span class="unit">万</span></th>';
    h += '<th>流水<br><span class="unit">万元</span></th>';
    h += '<th>付费率<br><span class="unit">%</span></th>';
    h += '<th>付费ARPU<br><span class="unit">元</span></th>';
    h += '<th class="evt-hd">动态</th>';
    h += '</tr></thead><tbody>';

    MOBILE_ORDER.forEach(game => {
        const alias = MOBILE_ALIAS[game] || game;
        const cur = idx[date + '|' + game] || {};
        const prev = prevDate ? (idx[prevDate + '|' + game] || {}) : {};
        const week = weekDate ? (idx[weekDate + '|' + game] || {}) : {};
        const evt = getEvent(alias, date, 'mobile') || getEvent(game, date, 'mobile');

        h += `<tr><td class="game sticky">${alias}</td>`;

        // DAU
        const dau = cur.dau;
        h += dau ? cellHTML((dau/10000).toLocaleString('en', {maximumFractionDigits:0}),
            pctChg(dau, prev.dau), pctChg(dau, week.dau)) : cellHTML(null);

        // 新增
        const nu = cur.new_users;
        h += nu ? cellHTML((nu/10000).toLocaleString('en', {maximumFractionDigits:0}),
            pctChg(nu, prev.new_users), pctChg(nu, week.new_users)) : cellHTML(null);

        // 流水
        const rev = cur.revenue;
        h += rev ? cellHTML((rev/10000).toLocaleString('en', {maximumFractionDigits:0}),
            pctChg(rev, prev.revenue), pctChg(rev, week.revenue)) : cellHTML(null);

        // 付费率
        const pr = cur.pay_rate;
        h += pr ? cellHTML(pr.toFixed(2), (pr - (prev.pay_rate||0)), (pr - (week.pay_rate||0)), 'pp', 'pp') : cellHTML(null);

        // ARPU
        const arpu = cur.arpu;
        h += arpu ? cellHTML(arpu.toLocaleString('en', {maximumFractionDigits:0}),
            pctChg(arpu, prev.arpu), pctChg(arpu, week.arpu)) : cellHTML(null);

        h += `<td class="evt">${evt}</td></tr>`;
    });
    h += '</tbody></table>';
    document.getElementById('mainTable').innerHTML = h;

    // 留存表
    let rh = '<h3 class="section-title">新增用户留存</h3><div class="scroll"><table><thead><tr>';
    rh += '<th class="sticky">游戏</th><th>次日留存<br><span class="unit">%</span></th>';
    rh += '<th>3日留存<br><span class="unit">%</span></th><th>7日留存<br><span class="unit">%</span></th>';
    rh += '</tr></thead><tbody>';
    MOBILE_ORDER.forEach(game => {
        const alias = MOBILE_ALIAS[game] || game;
        const cur = idx[date + '|' + game] || {};
        const prev = prevDate ? (idx[prevDate + '|' + game] || {}) : {};
        rh += `<tr><td class="game sticky">${alias}</td>`;
        ['retention_d1','retention_d3','retention_d7'].forEach(k => {
            const v = cur[k]; const pv = prev[k] || 0;
            rh += v ? cellHTML(v.toFixed(1), v - pv, 0, 'pp', 'pp') : cellHTML(null);
        });
        rh += '</tr>';
    });
    rh += '</tbody></table></div>';
    document.getElementById('retentionSection').innerHTML = rh;
}

function renderPC(date, prevDate, weekDate) {
    const idx = pcIdx;
    let h = '<table><thead><tr>';
    h += '<th class="sticky">游戏</th>';
    h += '<th>DAU<br><span class="unit">万</span></th>';
    h += '<th>新增<br><span class="unit"></span></th>';
    h += '<th>流水<br><span class="unit">万元</span></th>';
    h += '<th>付费率<br><span class="unit">%</span></th>';
    h += '<th>ARPPU<br><span class="unit">元</span></th>';
    h += '<th>ARPU<br><span class="unit">元</span></th>';
    h += '<th>在线时长<br><span class="unit">小时</span></th>';
    h += '<th class="evt-hd">动态</th>';
    h += '</tr></thead><tbody>';

    PC_ORDER.forEach(game => {
        const alias = PC_ALIAS[game] || game;
        const cur = idx[date + '|' + game] || {};
        const prev = prevDate ? (idx[prevDate + '|' + game] || {}) : {};
        const week = weekDate ? (idx[weekDate + '|' + game] || {}) : {};
        const evt = getEvent(alias, date, 'pc') || getEvent(game, date, 'pc');

        h += `<tr><td class="game sticky">${alias}</td>`;

        function pcCell(key, div, isRate) {
            const v = cur[key]; if (!v) return cellHTML(null);
            const pv = prev[key]||0; const wv = week[key]||0;
            if (isRate) return cellHTML(v.toFixed(2), v-pv, v-wv, 'pp', 'pp');
            const d = div > 1 ? (v/div).toLocaleString('en',{maximumFractionDigits:0}) : v.toLocaleString('en',{maximumFractionDigits:0});
            return cellHTML(d, pctChg(v,pv), pctChg(v,wv));
        }

        h += pcCell('dau', 10000);
        h += pcCell('reg', 1);
        h += pcCell('revenue', 10000);
        h += pcCell('pay_rate', 1, true);
        h += pcCell('arppu', 1);
        h += pcCell('arpu', 1);
        h += pcCell('online_hours', 1);
        h += `<td class="evt">${evt}</td></tr>`;
    });
    h += '</tbody></table>';
    document.getElementById('mainTable').innerHTML = h;
    document.getElementById('retentionSection').innerHTML = '';
}

function setType(t) { curType = t; render(); }
function prevDate() { if (curDateIdx > 0) { curDateIdx--; render(); } }
function nextDate() { if (curDateIdx < DATA.dates.length - 1) { curDateIdx++; render(); } }
function selectDate(d) {
    const i = DATA.dates.indexOf(d);
    if (i >= 0) { curDateIdx = i; render(); }
}

// Init date selector
const sel = document.getElementById('dateSelect');
DATA.dates.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
});

render();
</script>
</body>
</html>
